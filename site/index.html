<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12161f">
  <title>Minifigure Series</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="dot"></span><span class="txt">Minifigure Series</span></a>
    <input id="q" type="search" placeholder="Search series, year or number" aria-label="Search">
  </header>
  <main class="wrap">
    <p class="summary" id="summary"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No series match.</p>
  </main>

  <script src="data.js"></script>
  <script>
    // Home page: one tile per series (flat bag artwork, set number, title), filtered by search.
    const catalog = window.CATALOG || [];
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const figCount = catalog.reduce((n, s) => n + s.figures.length, 0);
    document.getElementById('summary').textContent =
      `${catalog.length} series · ${figCount} minifigures`;

    function cover(s) {
      return (s.bag && s.bag.img) || (s.group && s.group.img) || '';
    }

    function render(filter) {
      const f = filter.trim().toLowerCase();
      const list = catalog.filter(s =>
        !f || s.name.toLowerCase().includes(f) || String(s.year).includes(f) || s.id.includes(f));
      grid.replaceChildren(...list.map(s => {
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = `series.html?id=${encodeURIComponent(s.id)}`;
        if (s.color) a.style.setProperty('--c', s.color);
        a.innerHTML = `<img class="art" loading="lazy" alt="">
          <span class="setno"></span>
          <div class="cap"><h2></h2><p></p></div>`;
        a.querySelector('img').src = cover(s);
        a.querySelector('.setno').textContent = s.id;
        a.querySelector('h2').textContent = s.name;
        a.querySelector('p').textContent = `${s.year} · ${s.figures.length} figures`;
        return a;
      }));
      document.getElementById('empty').hidden = list.length > 0;
    }

    try { q.value = sessionStorage.getItem('q') || ''; } catch (e) {}
    q.addEventListener('input', () => {
      try { sessionStorage.setItem('q', q.value); } catch (e) {}
      render(q.value);
    });
    render(q.value);
  </script>
</body>
</html>
