# Intended auth settings for the project. Design: docs/design/V2-01-schema.md.
# Records intent; live settings are checked by the smoke test in the design doc.
# SOURCE: key names from https://supabase.com/docs/guides/local-development/cli/config
project_id = "lego-minifigures-sets"

[auth]
site_url = "https://minifighunt.com/"
# Record of intent only (the hosted project is set in the dashboard).
additional_redirect_urls = ["https://minifighunt.com/"]
# Global flag: nobody signs up. Accounts are created by an admin.
# SOURCE: https://github.com/supabase/supabase/issues/40582
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Stays on: turning it off disables the whole email provider, so sign-in would break too.
# SOURCE: https://github.com/supabase/supabase/issues/40582
enable_signup = true
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false

# V2-04: the database trigger calls this function with no user JWT; the shared secret
# ALERT_HOOK_SECRET is the gate (constant-time compare inside the function).
[functions.telegram-alert]
verify_jwt = false

# V2-05: admin page calls this with the signed-in user JWT; the function re-checks admins.
[functions.admin-people]
verify_jwt = true
