version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
    groups:
      pip-all:
        patterns:
          - "*"
