<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minifig Vault - Collectible Minifigures</title>
<link rel="stylesheet" href="shelf.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <a class="logo" href="index.html" aria-label="Minifig Vault home">
        <span class="logo-brick" aria-hidden="true"></span>
        <span class="logo-text">Minifig Vault<small>Collectible Minifigures</small></span>
      </a>
      <div class="tools" role="search">
        <div class="field search">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="#1A1A1A" stroke-width="3"/><path d="M15 15l6 6" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search name, number, year" aria-label="Search series by name, set number or year" autocomplete="off">
        </div>
        <div class="field sort">
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">A - Z</option>
            <option value="count">Most figures</option>
          </select>
        </div>
      </div>
    </div>
    <h1 class="hero-line">Every bag.<br><em>Every figure.</em></h1>
    <p class="hero-sub">Your Collectible Minifigures shelf. Track what you own and flag the series you still hunt for.</p>
  </div>
</header>

<main class="wrap">
  <div class="meta-bar"><span><strong id="count">6</strong> series on the shelf</span><span id="owned-total"></span></div>
  <div id="grid" class="shelf-grid" aria-live="polite"></div>
</main>

<footer><div class="wrap">Mockup A "Toy Shelf". Images: BrickLink catalog. Data: Rebrickable. LEGO is a trademark of the LEGO Group.</div></footer>

<script src="../assets/data.js"></script>
<script>
(function () {
  "use strict";
  // Mock ownership counts per series id (visual only, not real collection data).
  var OWNED = { "71053": 4, "71045": 12, "71038": 7, "71031": 2, "71019": 9, "8683": 0 };
  var WANTED = { "71031": true };

  var grid = document.getElementById("grid");
  var q = document.getElementById("q");
  var sortSel = document.getElementById("sort");
  var series = (window.MOCK && window.MOCK.series) || [];

  var HEART = '<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  function sorted(list) {
    var mode = sortSel.value;
    return list.slice().sort(function (a, b) {
      if (mode === "oldest") return a.year - b.year || a.id.localeCompare(b.id);
      if (mode === "az") return a.name.localeCompare(b.name);
      if (mode === "count") return b.figureCount - a.figureCount || b.year - a.year;
      return b.year - a.year || b.id.localeCompare(a.id);
    });
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var list = sorted(series.filter(function (s) {
      return !term || (s.name + " " + s.id + " " + s.year).toLowerCase().indexOf(term) !== -1;
    }));
    document.getElementById("count").textContent = list.length;
    if (!list.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><b>Empty shelf</b>No series matches "' + esc(q.value) + '". Try a set number like 71019.</div>';
      return;
    }
    grid.innerHTML = list.map(function (s) {
      var own = OWNED[s.id] || 0;
      var pct = Math.round(own / s.figureCount * 100);
      var wanted = !!WANTED[s.id];
      return '<article class="series">' +
        '<button class="btn want" type="button" data-id="' + esc(s.id) + '" aria-pressed="' + wanted + '" aria-label="Want whole series ' + esc(s.name) + '" title="Want whole series">' + HEART + '</button>' +
        '<a class="series-link" href="series.html?id=' + encodeURIComponent(s.id) + '">' +
          '<div class="bag-stage"><img src="../' + esc(s.bag) + '" alt="' + esc(s.name) + ' blind bag"></div>' +
          '<div class="series-info">' +
            '<span class="tile-label"><span class="y">#' + esc(s.id) + '</span> ' + s.year + '</span>' +
            '<h2>' + esc(s.name) + '</h2>' +
            '<div class="facts"><span>' + s.figureCount + ' figures</span><span>' + (pct === 100 ? 'Complete' : pct + '% done') + '</span></div>' +
            '<div class="prog-row"><span>Owned</span><b>' + own + '/' + s.figureCount + '</b></div>' +
            '<div class="progress" role="progressbar" aria-label="Owned figures" aria-valuemin="0" aria-valuemax="' + s.figureCount + '" aria-valuenow="' + own + '"><i style="width:' + pct + '%"></i></div>' +
          '</div>' +
        '</a>' +
      '</article>';
    }).join("");
  }

  grid.addEventListener("click", function (e) {
    var b = e.target.closest(".want");
    if (!b) return;
    var on = b.getAttribute("aria-pressed") !== "true";
    WANTED[b.dataset.id] = on;
    b.setAttribute("aria-pressed", String(on));
  });
  q.addEventListener("input", render);
  sortSel.addEventListener("change", render);

  var tot = 0, owned = 0;
  series.forEach(function (s) { tot += s.figureCount; owned += OWNED[s.id] || 0; });
  document.getElementById("owned-total").textContent = owned + " of " + tot + " figures owned";
  render();
})();
</script>
</body>
</html>
